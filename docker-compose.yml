services:
  trading-bot:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: trading-bot
    restart: unless-stopped
    ports:
      - "5000:5000"
    environment:
      - ACCESS_TOKEN=${ACCESS_TOKEN:?ACCESS_TOKEN is required}
      - DHAN_CLIENT_ID=${DHAN_CLIENT_ID:?DHAN_CLIENT_ID is required}
      - API_KEY=${API_KEY:-}
      - DHAN_PIN=${DHAN_PIN:-}
      - DHAN_TOTP_SECRET=${DHAN_TOTP_SECRET:-}
      - DHAN_WEBHOOK_SECRET=${DHAN_WEBHOOK_SECRET:-}
      - TELEGRAM_BOT_TOKEN=${TELEGRAM_BOT_TOKEN:?TELEGRAM_BOT_TOKEN is required}
      - TELEGRAM_CHAT_ID=${TELEGRAM_CHAT_ID:?TELEGRAM_CHAT_ID is required}
      - CHANNEL_SERVICE_ALERTS_ID=${CHANNEL_SERVICE_ALERTS_ID:-}
      - CHANNEL_TRADE_CONTROL_ID=${CHANNEL_TRADE_CONTROL_ID:-}
      - PRACTICE_MODE=${PRACTICE_MODE:-true}
      - AUTO_TRADING_ENABLED=${AUTO_TRADING_ENABLED:-false}
      - MAX_LOSS_PER_TRADE=${MAX_LOSS_PER_TRADE:-500}
      - MAX_POSITION_SIZE=${MAX_POSITION_SIZE:-5}
      - TIMEZONE=${TIMEZONE:-Asia/Kolkata}
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
      - FLASK_ENV=${FLASK_ENV:-production}
      - PORT=5000
      - SERVER_HOST=0.0.0.0
      - DATABASE_URL=${DATABASE_URL:?DATABASE_URL is required}
      - REDIS_URL=${REDIS_URL:-}
    volumes:
      - ./logs:/app/logs
      - ./backups:/app/backups
      - trading_state:/app/state
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - trading-network
    healthcheck:
      test: ["CMD", "python", "deployment/health_check.py"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  postgres:
    image: postgres:16-alpine
    container_name: trading-bot-postgres
    restart: unless-stopped
    environment:
      - POSTGRES_DB=${POSTGRES_DB:-trading_bot}
      - POSTGRES_USER=${POSTGRES_USER:-trading_bot}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./backups:/backups
    networks:
      - trading-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-trading_bot} -d ${POSTGRES_DB:-trading_bot}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: trading-bot-redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    networks:
      - trading-network
    profiles:
      - cache

networks:
  trading-network:
    driver: bridge

volumes:
  trading_state:
  postgres_data:
  redis_data:
