services:
  trading-bot:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: trading-bot
    restart: unless-stopped
    ports:
      - "5000:5000"
    env_file:
      - config/.env.development
    environment:
      - FLASK_ENV=${FLASK_ENV:-production}
      - PORT=5000
      - SERVER_HOST=0.0.0.0
      - DATABASE_URL=${DATABASE_URL:-postgresql://trading_bot:trading_bot@postgres:5432/trading_bot}
      - REDIS_URL=${REDIS_URL:-}
    volumes:
      - ./logs:/app/logs
      - ./backups:/app/backups
      - trading_state:/app/state
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - trading-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  postgres:
    image: postgres:16-alpine
    container_name: trading-bot-postgres
    restart: unless-stopped
    environment:
      - POSTGRES_DB=${POSTGRES_DB:-trading_bot}
      - POSTGRES_USER=${POSTGRES_USER:-trading_bot}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-trading_bot}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./backups:/backups
    networks:
      - trading-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-trading_bot} -d ${POSTGRES_DB:-trading_bot}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: trading-bot-redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    networks:
      - trading-network
    profiles:
      - cache

networks:
  trading-network:
    driver: bridge

volumes:
  trading_state:
  postgres_data:
  redis_data:
